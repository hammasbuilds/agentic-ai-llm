name: agentic-ai-llm

services:
  redis:
    image: redis:8-alpine
    container_name: aal-redis
    ports: ["6379:6379"]
    # The generation cache is the expensive thing in here - an hour of GPU time
    # per few hundred entries - so it is persisted rather than kept in memory only.
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: aal-kafka
    ports: ["9092:9092"]
    environment:
      # KRaft: no ZooKeeper. One node is the right size for one GPU.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Ten, one per app, because `bus.submit` keys `jobs.requested` by app name so
      # that one app's long sweep occupies one partition and cannot delay another's
      # short run. This was unset, which means Kafka's default of ONE - so the README
      # line "partitioned by app keeps a long sweep from starving a short one"
      # described the exact opposite of what shipped: a single FIFO queue shared by
      # all ten. Auto-created topics take this as their partition count.
      KAFKA_NUM_PARTITIONS: 10
      # jobs.completed is the replayable record of every measurement ever run here,
      # so it is kept for a year rather than the default week.
      KAFKA_LOG_RETENTION_HOURS: 8760
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 25s

volumes:
  redis-data:
  kafka-data:
