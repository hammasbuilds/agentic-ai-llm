[project]
name = "agentic-ai-llm"
version = "0.1.0"
description = "Ten measurement tools for local coder models, each shipped as a running product: FastAPI + HTMX UI, Kafka event bus, Redis state, LangGraph orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "llm", "agents", "kafka", "redis", "langgraph", "langchain",
    "fastapi", "htmx", "evaluation", "mbpp", "humaneval", "swe-bench",
]

dependencies = [
    # Web layer. Server-rendered HTML with HTMX rather than a JS build step: the
    # interesting part of these apps is the measurement, and a bundler would be a
    # second thing to keep working.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # Event bus. Every job is published to Kafka and every progress tick comes back
    # on a topic, so the UI is a consumer rather than a poller.
    "aiokafka>=0.12",
    # State, cache and pub/sub. Generation caching moved here from the filesystem so
    # several apps share one cache.
    "redis>=5.2",
    # Orchestration for the multi-step runs.
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "httpx>=0.28",
    # Data
    "pandas>=2.2",
    "pyarrow>=15",
]

[dependency-groups]
# fakeredis so the Redis-up branches are testable. Fifteen of the nineteen async
# functions in `apps/_platform/cache.py` had only their except-branch exercised: every
# test ran with no Redis, so "it degrades" was covered and "it works" was not.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16,<0.17", "fakeredis>=2.39"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

# The twenty products and the platform they share are one workspace, so
# `agentplatform` resolves from the checkout rather than from PyPI, where it is
# not published. Before this, every product declared no dependencies and
# imported `agentplatform` in its source anyway; the only thing that resolved it
# was a `pythonpath` entry under `[tool.pytest.ini_options]`, which the built
# wheel does not carry - so the tests passed and every wheel was broken.
#
# `projects/*` are deliberately NOT members. Each is a standalone zero-dependency
# tool and belongs to nobody's workspace.
[tool.uv.workspace]
members = ["products/*"]
# products/ also holds data, docs and scripts, which are directories and not packages.
# A bare glob claimed them as workspace members and uv refused the whole workspace -
# so `uv sync`, `uv lock` and `uv build --package` all failed with an error naming an
# internal layout problem. That made a stranger's first command worse than before the
# workspace existed, which is the opposite of the point.
exclude = ["products/data", "products/docs", "products/scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `projects/*` and `products/*` are independent packages, each with its own
# pyproject and its own `pythonpath = ["src"]`. Running pytest from here tried
# to collect them, could not import their src packages, and stopped with 94
# collection errors - a repository that looks broken because of a layout doing
# exactly what it was designed to do. `testpaths` alone does not prevent this
# when pytest is given an explicit path or run with --collect-only from the
# root, so the directories are excluded outright.
#
# Run them with `python scripts/test_all.py`, which executes each suite in its
# own process from its own directory.
norecursedirs = ["projects", "products", "apps", ".venv", "data", "*.egg-info"]
