[project]
name = "compliance-auditor"
version = "0.1.0"
description = "Check stated policy against collected evidence. No inferred compliance."
readme = "README.md"
authors = [{ name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"
dependencies = []

[project.scripts]
compliance-auditor = "auditor.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditor"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
