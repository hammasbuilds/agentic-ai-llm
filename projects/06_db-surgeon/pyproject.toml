[project]
name = "db-surgeon"
version = "0.1.0"
description = "Prove a migration's rollback on a throwaway copy before trusting it."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# sqlite3 is the shadow engine and it is in the standard library. sqlglot and
# Alembic were the planned stack; neither is needed to execute a migration and
# compare two snapshots.
dependencies = []

[project.scripts]
db-surgeon = "dbsurgeon.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbsurgeon"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# N818 wants an Error suffix. These names are public API, imported by name from
# other packages, and `raise NotAGitRepository(...)` reads better than
# `NotAGitRepositoryError(...)`. Renaming them would be a breaking change made
# for a naming convention.
"src/dbsurgeon/shadow.py" = ["N818"]
