[project]
name = "migration-pilot"
version = "0.1.0"
description = "Modernise Python mechanically, and refuse to when it would change meaning."
readme = "README.md"
authors = [{ name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"
dependencies = []

[project.scripts]
migration-pilot = "pilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pilot"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# N815/N818: `visit_AsyncFunctionDef` is the method name ast.NodeVisitor
# dispatches on - renaming it silently stops the visit - and the exception name
# is public API that reads better without the suffix.
"src/pilot/apply.py" = ["N815", "N818"]
