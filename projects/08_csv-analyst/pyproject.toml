[project]
name = "csv-analyst"
version = "0.1.0"
description = "Profile a CSV, compute only what validates, and never narrate a number that was not computed."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# csv reads, sqlite3 queries, statistics summarises, and the charts are SVG
# written by hand. DuckDB and pandas were the planned stack and neither is
# needed for aggregates over a single table.
dependencies = []

[project.optional-dependencies]
# The notebook view only. The analysis never imports it.
ui = ["marimo>=0.9"]

[project.scripts]
csv-analyst = "csvanalyst.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "csvanalyst"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# N818 wants an Error suffix. These names are public API, imported by name from
# other packages, and `raise NotAGitRepository(...)` reads better than
# `NotAGitRepositoryError(...)`. Renaming them would be a breaking change made
# for a naming convention.
"src/csvanalyst/execute.py" = ["N818"]
# marimo's notebook format, not style choices this project made. A cell receives its
# dependencies as parameters named after the globals they are - so a cell that uses
# `Path` takes an argument called `Path` - and a bare expression at the end of a cell is
# how marimo renders a widget.
"ui/notebook.py" = ["N803", "B018"]
