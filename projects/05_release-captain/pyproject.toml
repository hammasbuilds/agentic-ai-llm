[project]
name = "release-captain"
version = "0.1.0"
description = "Release readiness scored from diff statistics rather than from opinion."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# git is the data source and it is already installed. The UI is served by
# http.server from the standard library, so even the web view adds nothing.
dependencies = []

[project.scripts]
captain = "captain.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "captain"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# N818 wants an Error suffix. These names are public API, imported by name from
# other packages, and `raise NotAGitRepository(...)` reads better than
# `NotAGitRepositoryError(...)`. Renaming them would be a breaking change made
# for a naming convention.
"src/captain/history.py" = ["N818"]
