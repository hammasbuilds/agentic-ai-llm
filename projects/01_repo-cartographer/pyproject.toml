[project]
name = "repo-cartographer"
version = "0.1.0"
description = "Map an unfamiliar Python codebase from its AST. No embeddings, no model, no dependencies."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# The map is built with the standard library alone. tree-sitter was tried first
# and removed: for Python, `ast` resolves more calls because it carries real
# scope information. See README, "What I wrote vs what I installed".
dependencies = []

# No extras. `explain = ["httpx>=0.27"]` was here for "the explanation layer", which
# does not exist: `grep -rn httpx` over this package finds nothing. The banner above
# says "zero runtime dependencies, zero LLM calls, zero network", and an extra naming
# an HTTP client is the opposite claim - in the tree that ships a compliance control
# called `deps-used`.

[project.scripts]
cartographer = "cartographer.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cartographer"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
