[project]
name = "log-detective"
version = "0.1.0"
description = "Extract log templates, and report what the extraction destroyed."
readme = "README.md"
authors = [{ name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"
dependencies = []

[project.optional-dependencies]
ui = ["panel>=1.5"]

[project.scripts]
log-detective = "detective.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "detective"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
