{% extends "base.html" %}
{% block title %}Run {{ job_id }} · {{ theme.name }}{% endblock %}
{% block content %}

<div class="card" id="runner">
  <h2>Run {{ job_id }}
    <span class="chip" style="float:right">{{ job.transport or 'inline' }}</span>
  </h2>

  <div id="status" class="mono muted">
    <span class="spin">◐</span> starting…
  </div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="log" id="log"></div>
</div>

<div id="result"></div>

{% endblock %}
{% block scripts %}
<script>
  // Progress arrives over SSE, fed by Redis pub/sub from whichever worker picked the
  // job off Kafka. The page never polls.
  const log  = document.getElementById('log');
  const bar  = document.getElementById('pbar');
  const stat = document.getElementById('status');
  const src  = new EventSource('/job/{{ job_id }}/stream');

  function line(text) {
    log.textContent += text + '\n';
    log.scrollTop = log.scrollHeight;
  }

  src.addEventListener('tick', e => {
    const d = JSON.parse(e.data);
    if (d.total) {
      const pct = Math.round(100 * d.done / d.total);
      bar.style.width = pct + '%';
      stat.innerHTML = '<span class="spin">◐</span> ' + d.done + ' / ' + d.total + ' — ' + pct + '%';
    }
    if (d.note) line(d.note);
  });

  src.addEventListener('done', e => {
    const d = JSON.parse(e.data || '{}');
    src.close();
    bar.style.width = '100%';
    if (d.status === 'error') {
      stat.innerHTML = '<span class="bad">failed</span>';
      if (d.note) line('ERROR: ' + d.note);
    } else {
      stat.innerHTML = '<span class="good">complete</span>';
    }
    document.body.dispatchEvent(new Event('resultready'));
  });

  src.onerror = () => { stat.innerHTML = '<span class="warn">stream closed</span>'; src.close(); };

  // The result panel. This was `hx-get` plus `hx-trigger="load once, resultready from:body"`,
  // which is a CDN script for one fetch and one event listener - and the one thing on the
  // page that could not be done without the network was the thing that showed the answer.
  const panel = document.getElementById('result');

  async function showResult() {
    try {
      const r = await fetch('/job/{{ job_id }}/result');
      // The server renders this fragment; a non-200 means the job has no result yet or
      // the run failed, and the status line above has already said which.
      if (!r.ok) { return; }
      panel.innerHTML = await r.text();
    } catch (err) {
      // Said rather than swallowed: a blank panel with no explanation is what the CDN
      // outage looked like, and that is the failure this replaced.
      panel.innerHTML = '<div class="card"><p class="bad">The result could not be '
        + 'fetched: ' + String(err) + '</p></div>';
    }
  }

  // `load once` and `resultready`, which is what the two htmx triggers meant.
  showResult();
  document.body.addEventListener('resultready', showResult, { once: true });
</script>
{% endblock %}
