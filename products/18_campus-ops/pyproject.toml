[project]
name = "campus-ops"
version = "0.1.0"
description = "Education administration: admissions, timetabling, fee reconciliation, attendance and parent communications."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# Every dependency this product will eventually need (FastAPI, a Kafka
# client, redis-py, psycopg) is a deployment concern. The deterministic core
# below it has none, so the tests run offline with no broker and no model.
# `agentplatform[api,ollama]`, not bare `agentplatform`. The deterministic core needs
# nothing, which is why the tests run offline - but `app.py:main()`, the command this
# product's README gives, imports uvicorn and builds `api.create_app(...)` around an
# `Ollama` model. Declared bare, a clean install of this product cannot run the thing
# it documents, and the failure is a ModuleNotFoundError at the first line of main().
dependencies = ["agentplatform[api,ollama]"]

# From the workspace, not from an index: it is not published anywhere.
[tool.uv.sources]
agentplatform = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "campusops"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../platform/src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
