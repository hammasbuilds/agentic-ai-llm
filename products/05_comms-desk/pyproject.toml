[project]
name = "comms-desk"
version = "0.1.0"
description = "Email and meetings reconciled into one board of commitments, each attributed to who made it."
readme = "README.md"
authors = [
    { name = "Muhammad Hammas", email = "214618908+hammasbuilds@users.noreply.github.com" }
]
requires-python = ">=3.11"
# SPDX form, not { text = ... }: uv_build rejects license-files beside the table
# form, and the expression is what an index and a trust index actually read.
license = "MIT"

# Every dependency this product will eventually need (FastAPI, a Kafka
# client, redis-py, psycopg) is a deployment concern. The deterministic core
# below it has none, so the tests run offline with no broker and no model.
dependencies = ["agentplatform"]

# From the workspace, not from an index: it is not published anywhere.
[tool.uv.sources]
agentplatform = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "comms"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../platform/src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
